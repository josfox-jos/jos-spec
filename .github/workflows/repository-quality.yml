name: JOS repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validator
        run: python -m pip install "jsonschema==4.23.0"

      - name: Run JOS repository quality gate
        run: python scripts/repository_quality_gate.py
